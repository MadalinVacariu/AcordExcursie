<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acord Părinți - Activitate Marți (20 Octombrie)</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px 10px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #0f172a;
      text-align: center;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
      text-align: center;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .input-child {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .input-child:focus {
      border-color: var(--primary);
    }

    .status-select {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      background: #fff;
      cursor: pointer;
    }

    .badge-ok {
      background-color: #dcfce7;
      color: #15803d;
      font-weight: 500;
    }

    .badge-propus {
      background-color: #e0f2fe;
      color: #0369a1;
      font-weight: 500;
    }

    .badge-refuz {
      background-color: #fee2e2;
      color: #b91c1c;
      font-weight: 500;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-save {
      background: var(--primary);
      color: white;
    }

    .btn-save:hover {
      background: #1d4ed8;
    }

    .btn-export {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-export:hover {
      background: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tabel Acord Părinți</h1>
    <p class="subtitle">Activitate programată pentru <strong>marți, 20 octombrie</strong></p>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">Nr.</th>
            <th>Nume Părinte</th>
            <th>Nume Elev</th>
            <th style="width: 240px;">Stare / Opțiune</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rândurile se generează dinamic -->
        </tbody>
      </table>
    </div>

    <div class="actions">
      <button class="btn-export" onclick="exportData()">Descarcă lista (.json)</button>
      <button class="btn-save" onclick="saveData()">Salvează modificările</button>
    </div>
  </div>

  <script>
    const listaParinti = [
      "Cătălinoiu", "Sofronie", "Sion", "Cândea", "Blaga",
      "Popovici", "Furdui", "Mihalache", "Togan", "Ovcharuk",
      "Zămăcău", "Mărgineanu", "Bologa", "Arsentea (Copil 1)",
      "Arsentea (Copil 2)", "Mihoc", "Gabor", "Hălmaciu"
    ];

    // Citire date salvate local dacă există
    const savedData = JSON.parse(localStorage.getItem("acord_parinti_20oct") || "{}");

    const tbody = document.getElementById("table-body");

    listaParinti.forEach((parinte, index) => {
      const nr = index + 1;
      const childVal = savedData[nr]?.copil || "";
      const statusVal = savedData[nr]?.status || "";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${nr}</td>
        <td><strong>${parinte}</strong></td>
        <td>
          <input type="text" class="input-child" id="copil-${nr}" placeholder="Scrieți numele copilului..." value="${childVal}">
        </td>
        <td>
          <select class="status-select" id="status-${nr}" onchange="updateRowColor(this)">
            <option value="">-- Alegeți opțiunea --</option>
            <option value="acord" ${statusVal === 'acord' ? 'selected' : ''}>Sunt de acord</option>
            <option value="propus" ${statusVal === 'propus' ? 'selected' : ''}>Am propus eu activitatea</option>
            <option value="nu" ${statusVal === 'nu' ? 'selected' : ''}>Nu sunt de acord</option>
          </select>
        </td>
      `;
      tbody.appendChild(tr);
    });

    function updateRowColor(selectElem) {
      selectElem.className = 'status-select';
      if (selectElem.value === 'acord') selectElem.classList.add('badge-ok');
      else if (selectElem.value === 'propus') selectElem.classList.add('badge-propus');
      else if (selectElem.value === 'nu') selectElem.classList.add('badge-refuz');
    }

    // Aplica culorile inițiale
    document.querySelectorAll('.status-select').forEach(updateRowColor);

    function saveData() {
      const data = {};
      listaParinti.forEach((_, index) => {
        const nr = index + 1;
        data[nr] = {
          copil: document.getElementById(`copil-${nr}`).value,
          status: document.getElementById(`status-${nr}`).value
        };
      });
      localStorage.setItem("acord_parinti_20oct", JSON.stringify(data));
      alert("Datele au fost salvate cu succes în memoria dispozitivului!");
    }

    function exportData() {
      saveData();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem("acord_parinti_20oct"));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", "acord_parinti_20_octombrie.json");
      dlAnchorElem.click();
    }
  </script>
</body>
</html>
