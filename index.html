<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acord Părinți - Activitate Marți (20 Octombrie)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --green-bg: #dcfce7;
      --green-border: #16a34a;
      --green-text: #15803d;
      --red-bg: #fee2e2;
      --red-border: #dc2626;
      --red-text: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #0f172a;
      text-align: center;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 20px;
      text-align: center;
    }

    .status-toast {
      text-align: center;
      font-size: 0.85rem;
      color: #16a34a;
      font-weight: 500;
      min-height: 20px;
      margin-bottom: 12px;
      transition: opacity 0.3s;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
    }

    tr:hover {
      background-color: #fcfdfe;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .choice-btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #ffffff;
      color: #475569;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .choice-btn:hover {
      background-color: #f1f5f9;
    }

    /* Stare activă: De acord */
    .choice-btn.btn-agree.active {
      background-color: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--green-border);
    }

    /* Stare activă: Nu */
    .choice-btn.btn-refuse.active {
      background-color: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--red-border);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tabel Acord Părinți</h1>
    <p class="subtitle">Activitate programată pentru <strong>marți, 20 octombrie</strong></p>
    
    <div id="toast" class="status-toast"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">Nr.</th>
            <th>Nume Părinte</th>
            <th style="width: 260px;">Opțiune</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rândurile sunt generate în ordine alfabetică -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Lista părinților ordonată alfabetic (Arsentea are 2 rânduri distincte pentru cei 2 copii)
    const listaParinti = [
      { id: "1", nume: "Arsentea (Copil 1)" },
      { id: "2", nume: "Arsentea (Copil 2)" },
      { id: "3", nume: "Blaga" },
      { id: "4", nume: "Bologa" },
      { id: "5", nume: "Cândea" },
      { id: "6", nume: "Cătălinoiu" },
      { id: "7", nume: "Furdui" },
      { id: "8", nume: "Gabor" },
      { id: "9", nume: "Hălmaciu" },
      { id: "10", nume: "Mărgineanu" },
      { id: "11", nume: "Mihalache" },
      { id: "12", nume: "Mihoc" },
      { id: "13", nume: "Ovcharuk" },
      { id: "14", nume: "Popovici" },
      { id: "15", nume: "Sion" },
      { id: "16", nume: "Sofronie" },
      { id: "17", nume: "Togan" },
      { id: "18", nume: "Zămăcău" }
    ];

    // Încărcare din memoria dispozitivului
    const savedChoices = JSON.parse(localStorage.getItem("acord_parinti_optiuni") || "{}");
    const tbody = document.getElementById("table-body");
    const toast = document.getElementById("toast");

    listaParinti.forEach((item, index) => {
      const nr = index + 1;
      const currentChoice = savedChoices[item.id] || "";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${nr}</td>
        <td><strong>${item.nume}</strong></td>
        <td>
          <div class="btn-group">
            <button type="button" 
                    id="btn-agree-${item.id}" 
                    class="choice-btn btn-agree ${currentChoice === 'da' ? 'active' : ''}" 
                    onclick="setChoice('${item.id}', 'da')">
              ✓ De acord
            </button>
            <button type="button" 
                    id="btn-refuse-${item.id}" 
                    class="choice-btn btn-refuse ${currentChoice === 'nu' ? 'active' : ''}" 
                    onclick="setChoice('${item.id}', 'nu')">
              ✕ Nu
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    let toastTimeout;
    function setChoice(id, valoare) {
      const btnAgree = document.getElementById(`btn-agree-${id}`);
      const btnRefuse = document.getElementById(`btn-refuse-${id}`);

      // Dacă utilizatorul apasă din nou pe aceeași opțiune, o debifează
      if (savedChoices[id] === valoare) {
        delete savedChoices[id];
        btnAgree.classList.remove('active');
        btnRefuse.classList.remove('active');
      } else {
        savedChoices[id] = valoare;
        if (valoare === 'da') {
          btnAgree.classList.add('active');
          btnRefuse.classList.remove('active');
        } else {
          btnRefuse.classList.add('active');
          btnAgree.classList.remove('active');
        }
      }

      // Salvare automată instantanee
      localStorage.setItem("acord_parinti_optiuni", JSON.stringify(savedChoices));

      // Indicator vizual discret de salvare
      toast.textContent = "Modificare salvată automat!";
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.textContent = "";
      }, 2000);
    }
  </script>
</body>
</html>
